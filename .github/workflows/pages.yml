# Publica la versión estática (simulación en el navegador) en GitHub Pages en cada push.
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Tests y comprobación de tipos
        run: |
          npm test
          npm run typecheck

      - name: Compilar la versión estática
        env:
          # Sitio de proyecto: https://<usuario>.github.io/<repositorio>/  → prefijo /<repositorio>/
          # Con dominio propio, define la variable del repositorio BASE_PATH = /
          BASE_PATH: ${{ vars.BASE_PATH || (endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name)) }}
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
