# =====================================================================
#  nginx delante de la demo de gemelos digitales
#  Copia este fichero a /etc/nginx/conf.d/gemelos.conf (o a sites-available
#  + enlace en sites-enabled), ajusta los dominios y certificados y ejecuta:
#      sudo nginx -t && sudo systemctl reload nginx
#
#  La app escucha en 127.0.0.1:8080 (ver docker-compose.yml, PUERTO_LOCAL).
#  Elige UNA de las dos opciones: A (subdominio propio) o B (ruta /gemelos/).
# =====================================================================

# Necesario para el WebSocket (/ws): una sola vez por servidor nginx.
# Si ya tienes un "map $http_upgrade" en otro fichero, borra este bloque.
map $http_upgrade $gemelos_connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------
#  OPCIÓN A · Subdominio propio:  https://gemelos.tudominio.es/
#  En el .env de la app:  BASE_PATH=   (vacío)
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name gemelos.tudominio.es;
    return 301 https://$host$request_uri;
}

server {
    # "ssl http2" funciona en todas las versiones de nginx (en ≥ 1.25.1 avisa de que es antiguo, sin fallar)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gemelos.tudominio.es;

    # Certificados (p. ej. con: sudo certbot --nginx -d gemelos.tudominio.es)
    ssl_certificate     /etc/letsencrypt/live/gemelos.tudominio.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gemelos.tudominio.es/privkey.pem;

    # El único formulario (la contraseña) ocupa muy poco
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        # Host y esquema originales: los usa la app para comprobar el origen y marcar la cookie como Secure
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # IP real del visitante (se sobrescribe para que no se pueda falsificar desde fuera)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        # WebSocket (datos en tiempo real)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gemelos_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

